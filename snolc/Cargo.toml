[workspace]
resolver = "3"
members = [
  "crates/snolc-abi",
  "crates/snolc-sdk",
  "crates/snolc",
  "crates/snolc-cli",
  "crates/snolc-ffi",
  "modules/adapter-socks5",
  "modules/adapter-direct",
  "modules/protection-noise",
  "modules/carrier-tcp",
  "modules/policy-dummy",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.98.1"
authors = ["Owen Ewans <owenewans@tuta.io>"]
license = "Unlicense"
repository = "https://github.com/owenewans/snolc"

[workspace.dependencies]
async-executor = "=1.14.0"
async-io = "=2.6.0"
crossbeam-queue = "=0.3.12"
ctrlc = "=3.5.2"
futures = "=0.3.34"
libloading = "=0.9.0"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
smoltcp = { version = "=0.14.0", default-features = false }
thiserror = "=2.0.20"
toml = "=1.1.6"
yamux = "=0.14.0"
getrandom = "=0.3.4"
postcard = { version = "=1.1.3", features = ["alloc"] }
rand = "=0.10.2"
redb = "=4.3.0"
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
socket2 = { version = "=0.6.5", features = ["all"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt", "sync", "time"] }
zeroize = "=1.9.0"
snolc-sdk = { version = "=0.0.4", path = "crates/snolc-sdk" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
