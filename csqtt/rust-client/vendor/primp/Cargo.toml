[package]
edition = "2021"
rust-version = "1.89"
name = "primp"
version = "1.3.1"
authors = ["deedy5"]
build = false
include = [
    "README.md",
    "Cargo.toml",
    "LICENSE-MIT",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HTTP client with browser impersonation capabilities"
readme = "README.md"
keywords = [
    "http",
    "request",
    "client",
    "impersonate",
]
categories = ["web-programming::http-client"]
license = "MIT"
repository = "https://github.com/deedy5/primp"
resolver = "3"

[package.metadata.docs.rs]
features = [
    "impersonate",
    "socks",
    "hickory-dns",
    "rustls-no-provider",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--cfg",
    "reqwest_unstable",
]
rustc-args = [
    "--cfg",
    "reqwest_unstable",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
brotli = ["reqwest/brotli"]
cookies = ["reqwest/cookies"]
default = ["impersonate"]
default-tls = ["reqwest/default-tls"]
deflate = ["reqwest/deflate"]
form = ["reqwest/form"]
gzip = ["reqwest/gzip"]
hickory-dns = ["reqwest/hickory-dns"]
http2 = ["reqwest/http2"]
http3 = ["reqwest/http3"]
impersonate = [
    "dep:rand",
    "default-tls",
    "http2",
    "cookies",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
]
json = ["reqwest/json"]
multipart = ["reqwest/multipart"]
query = ["reqwest/query"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
socks = ["reqwest/socks"]
stream = ["reqwest/stream"]
system-proxy = ["reqwest/system-proxy"]
zstd = ["reqwest/zstd"]

[lib]
name = "primp"
path = "src/lib.rs"

[dependencies.http]
version = "1.1"

[dependencies.rand]
version = "0.10"
optional = true

[dependencies.reqwest]
version = "0.13"
default-features = false
package = "primp-reqwest"

[dependencies.url]
version = "2.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.h2]
version = "0.4"
features = ["unstable"]
package = "primp-h2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rustls]
version = "0.23"
features = [
    "std",
    "tls12",
    "impersonate",
    "zlib",
]
default-features = false
package = "primp-rustls"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.criterion]
version = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.serde]
version = "1.0"
features = ["derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.serde_json]
version = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1.0"
features = [
    "macros",
    "rt-multi-thread",
]
default-features = false
