[package]
name = "yptun-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust Linux runtime for YPtun"

[dependencies]
yptun-core = { path = "../yptun-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }

[[bin]]
name = "yptun-linux"
path = "src/main.rs"
