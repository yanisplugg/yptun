[package]
name = "yptun-desktop"
version = "0.1.0"
description = "Shared native Rust/Slint desktop client for YPtun on Windows and Linux"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "yptun"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "std",
] }
yptun-core = { path = "../yptun-core" }

[target.'cfg(windows)'.dependencies]
yptun-windows = { path = "../yptun-windows" }

[build-dependencies]
slint-build = "1.18.1"
