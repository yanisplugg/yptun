[package]
name = "yptun-desktop"
version = "4.0.0"
description = "Shared native Rust/Slint desktop client for YPtun on Windows and Linux"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "yptun"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "std",
] }
yptun-core = { path = "../yptun-core" }

[target.'cfg(windows)'.dependencies]
yptun-windows = { path = "../yptun-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
tempfile = "3"
