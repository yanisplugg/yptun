name: Native Apple release candidate
run-name: "Native Apple RC ${{ inputs.build_number }}${{ inputs.comment != '' && format(' — {0}', inputs.comment) || '' }}"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
        default: "501"
      comment:
        description: Build comment
        required: false
        type: string
        default: ""
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
      comment:
        description: Build comment
        required: false
        type: string
        default: ""
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-apple-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15-intel
    # Cold native builds can exceed two hours on public Intel runners; warm cache releases stay short.
    timeout-minutes: 180
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs and signing material
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "build_number must be a positive integer" >&2
            exit 1
          }
          signing_names=(
            IOS_DISTRIBUTION_CERT_P12_BASE64
            IOS_DISTRIBUTION_CERT_PASSWORD
            PROVISIONING_PROFILE_APP_BASE64
            PROVISIONING_PROFILE_TUNNEL_BASE64
            PROVISIONING_PROFILE_WIDGET_BASE64
          )
          signing_configured=false
          for name in "${signing_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then signing_configured=true; fi
          done
          if [[ "$signing_configured" == false ]]; then
            echo "Signing is not configured; this run will publish an unsigned IPA."
            exit 0
          fi
          for name in "${signing_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Signing is partially configured: $name is missing" >&2
              exit 1
            fi
          done
          echo "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.mobileprovision"
          echo "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" -o "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/tunnel.mobileprovision" -o "$RUNNER_TEMP/tunnel-profile.plist"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" -o "$RUNNER_TEMP/widget-profile.plist"
          python3 - <<'PY'
          import datetime
          import fnmatch
          import os
          import plistlib

          specs = (
              ("app", "org.yptun.app", True),
              ("tunnel", "org.yptun.app.tunnel", True),
              ("widget", "org.yptun.app.widget", False),
          )
          for name, bundle_id, needs_tunnel in specs:
              path = os.path.join(os.environ["RUNNER_TEMP"], f"{name}-profile.plist")
              with open(path, "rb") as source:
                  profile = plistlib.load(source)
              expires = profile.get("ExpirationDate")
              now = datetime.datetime.now(datetime.timezone.utc)
              if expires is None or expires.replace(tzinfo=datetime.timezone.utc) <= now:
                  raise SystemExit(f"{name} provisioning profile is expired")
              entitlements = profile.get("Entitlements", {})
              application_id = entitlements.get("application-identifier", "")
              pattern = application_id.split(".", 1)[-1]
              if not fnmatch.fnmatchcase(bundle_id, pattern):
                  raise SystemExit(
                      f"{name} profile application identifier {application_id!r} "
                      f"does not allow {bundle_id!r}"
                  )
              groups = entitlements.get("com.apple.security.application-groups", [])
              if "group.org.yptun.app" not in groups:
                  raise SystemExit(f"{name} profile does not allow group.org.yptun.app")
              network_extensions = entitlements.get(
                  "com.apple.developer.networking.networkextension", []
              )
              if needs_tunnel and "packet-tunnel-provider" not in network_extensions:
                  raise SystemExit(f"{name} profile does not allow packet-tunnel-provider")
              if not needs_tunnel and network_extensions:
                  raise SystemExit(f"{name} profile unexpectedly grants NetworkExtension")
              print(f"Validated {name} provisioning profile; expires {expires.isoformat()}")
          PY

      - name: Select pinned Xcode
        run: |
          XCODE=/Applications/Xcode_26.3.app
          if [ ! -d "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate and validate native Xcode project
        working-directory: YPtun/apple
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
          plutil -lint Configuration/iOS/*.plist Configuration/macOS/*.plist
          find . -name '*.entitlements' -print0 | xargs -0 -n1 plutil -lint

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            snolc -> target
            csqtt/rust-client -> target
          cache-on-failure: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      - name: Restore validated native Apple XCFrameworks
        id: apple-framework-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: apple-xcframeworks-v2-xcode-26.3-rust-1.99.1-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock', 'core/yptun-core/**', 'core/yptun-ffi/**', 'core/scripts/build-apple.sh', 'core/scripts/build-go-apple.sh', 'core/scripts/build-specialized-apple.sh', 'core/scripts/verify-apple-rust-link.sh', 'core/scripts/validate-apple-xcframeworks.py') }}-${{ hashFiles('cores/**', 'sing-box/**', 'xray-core/**', 'amneziawg-go/**', 'awgproxy/**', 'free-turn-proxy/**', 'wdtt/**', 'masterdns/**', 'olcrtc/**', 'openflux/**') }}-${{ hashFiles('snolc/**', 'csqtt/**') }}

      - name: Validate restored Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit == 'true'
        run: python3 core/scripts/validate-apple-xcframeworks.py

      - name: Build specialized Apple cores (fail-fast)
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-specialized-apple.sh

      - name: Build Rust XCFramework and Swift bindings
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-apple.sh

      - name: Probe combined Apple Rust archives
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/verify-apple-rust-link.sh

      - name: Build in-process Apple network cores
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: |
          (cd openflux && go mod tidy -diff)
          (cd cores && go mod tidy -diff)
          GOMOBILE_APPLE_TARGETS=ios,iossimulator,macos bash core/scripts/build-go-apple.sh

      - name: Validate built Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: python3 core/scripts/validate-apple-xcframeworks.py

      - name: Save validated native Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: ${{ steps.apple-framework-cache.outputs.cache-primary-key }}

      - name: Build unsigned device release
        working-directory: YPtun/apple
        run: |
          mkdir -p build
          xcodebuild \
            -project YPtunApple.xcodeproj \
            -scheme "YPtun iOS" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            MARKETING_VERSION=4.0.0 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|Undefined symbols|referenced from|\*\* BUILD" build/xcodebuild.log | head -120 || true
          exit $STATUS

      - name: Pack unsigned IPA
        working-directory: YPtun/apple
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/YPtun.app Payload/
          test -d Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex
          test -d Payload/YPtun.app/PlugIns/YPtunWidget.appex
          zip -qry "YPtun-4.0.0-$BUILD_NUMBER-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-ios-unsigned-${{ inputs.build_number }}
          path: YPtun/apple/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Sign IPA with Apple Distribution certificate
        working-directory: YPtun/apple
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERT_P12_BASE64" ]; then
            echo "Signing secrets are not configured; unsigned IPA remains available."
            exit 0
          fi
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/native-app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$IDENTITY"

          echo "$PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.mobileprovision"
          echo "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          cp "$RUNNER_TEMP/app.mobileprovision" Payload/YPtun.app/embedded.mobileprovision
          cp "$RUNNER_TEMP/tunnel.mobileprovision" Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex/embedded.mobileprovision
          cp "$RUNNER_TEMP/widget.mobileprovision" Payload/YPtun.app/PlugIns/YPtunWidget.appex/embedded.mobileprovision

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/app.entitlements"
          security cms -D -i "$RUNNER_TEMP/tunnel.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/tunnel.entitlements"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/widget.entitlements"
          for ent in "$RUNNER_TEMP/app.entitlements" "$RUNNER_TEMP/tunnel.entitlements"; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension array" "$ent"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension:0 string packet-tunnel-provider" "$ent"
            /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$ent" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true

          find Payload/YPtun.app -depth \( -name '*.framework' -o -name '*.dylib' \) | while read fw; do
            codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$fw"
          done
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/widget.entitlements" Payload/YPtun.app/PlugIns/YPtunWidget.appex
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/tunnel.entitlements" Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/app.entitlements" Payload/YPtun.app
          codesign --verify --strict --verbose=2 Payload/YPtun.app/PlugIns/YPtunWidget.appex
          codesign --verify --strict --verbose=2 Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex
          codesign --verify --strict --verbose=2 Payload/YPtun.app
          codesign --verify --deep --strict --verbose=2 Payload/YPtun.app
          mkdir -p build/signed-entitlements
          codesign -d --entitlements :- Payload/YPtun.app > build/signed-entitlements/app.plist
          codesign -d --entitlements :- Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex > build/signed-entitlements/tunnel.plist
          codesign -d --entitlements :- Payload/YPtun.app/PlugIns/YPtunWidget.appex > build/signed-entitlements/widget.plist
          plutil -lint build/signed-entitlements/*.plist
          zip -qry "YPtun-4.0.0-$BUILD_NUMBER-signed.ipa" Payload

      - name: Upload signed IPA to TestFlight
        if: inputs.upload_to_testflight == true
        working-directory: YPtun/apple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA="YPtun-4.0.0-$BUILD_NUMBER-signed.ipa"
          test -s "$IPA"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apple-xcodebuild-log-${{ inputs.build_number }}
          path: YPtun/apple/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YPtun-ios-signed-${{ inputs.build_number }}
          path: YPtun/apple/*-signed.ipa
          if-no-files-found: ignore
          retention-days: 14
