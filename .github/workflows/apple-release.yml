name: Native Apple release candidate
run-name: "Native Apple RC ${{ inputs.build_number }}${{ inputs.comment != '' && format(' — {0}', inputs.comment) || '' }}"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
        default: "500"
      comment:
        description: Build comment
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-apple-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      - name: Build Rust XCFramework and Swift bindings
        run: bash core/scripts/build-apple.sh

      - name: Build in-process iOS network cores
        run: |
          (cd openflux && go mod tidy)
          (cd cores && go mod tidy)
          GOMOBILE_APPLE_TARGETS=ios bash core/scripts/build-go-apple.sh

      - name: Build specialized iOS cores
        run: bash core/scripts/build-specialized-apple.sh

      - name: Generate native Xcode project
        working-directory: YPtun/apple
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate

      - name: Build unsigned device release
        working-directory: YPtun/apple
        run: |
          mkdir -p build
          xcodebuild \
            -project YPtunApple.xcodeproj \
            -scheme "YPtun iOS" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            MARKETING_VERSION=4.0.0 CURRENT_PROJECT_VERSION='${{ inputs.build_number }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|Undefined symbols|referenced from|\*\* BUILD" build/xcodebuild.log | head -120 || true
          exit $STATUS

      - name: Pack unsigned IPA
        working-directory: YPtun/apple
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/YPtun.app Payload/
          test -d Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex
          test -d Payload/YPtun.app/PlugIns/YPtunWidget.appex
          zip -qry "YPtun-4.0.0-${{ inputs.build_number }}-unsigned.ipa" Payload

      - name: Sign IPA with Apple Distribution certificate
        working-directory: YPtun/apple
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERT_P12_BASE64" ]; then
            echo "Signing secrets are not configured; unsigned IPA remains available."
            exit 0
          fi
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/native-app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "$PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.mobileprovision"
          echo "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          cp "$RUNNER_TEMP/app.mobileprovision" Payload/YPtun.app/embedded.mobileprovision
          cp "$RUNNER_TEMP/tunnel.mobileprovision" Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex/embedded.mobileprovision
          cp "$RUNNER_TEMP/widget.mobileprovision" Payload/YPtun.app/PlugIns/YPtunWidget.appex/embedded.mobileprovision

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/app.entitlements"
          security cms -D -i "$RUNNER_TEMP/tunnel.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/tunnel.entitlements"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/widget.entitlements"
          for ent in "$RUNNER_TEMP/app.entitlements" "$RUNNER_TEMP/tunnel.entitlements"; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension array" "$ent"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension:0 string packet-tunnel-provider" "$ent"
            /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$ent" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true

          find Payload/YPtun.app -depth \( -name '*.framework' -o -name '*.dylib' \) | while read fw; do
            codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$fw"
          done
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/widget.entitlements" Payload/YPtun.app/PlugIns/YPtunWidget.appex
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/tunnel.entitlements" Payload/YPtun.app/PlugIns/YPtunPacketTunnel.appex
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/app.entitlements" Payload/YPtun.app
          codesign --verify --deep --strict --verbose=2 Payload/YPtun.app
          zip -qry "YPtun-4.0.0-${{ inputs.build_number }}-signed.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apple-xcodebuild-log-${{ inputs.build_number }}
          path: YPtun/apple/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-ios-unsigned
          path: YPtun/apple/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-ios-signed
          path: YPtun/apple/*-signed.ipa
          if-no-files-found: ignore
          retention-days: 14
