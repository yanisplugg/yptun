# iOS build: Go cores (gomobile → Coreapi.xcframework), Kotlin SharedUI.framework, the Xcode project
# generated from YPtun/iosApp/project.yml (XcodeGen), then an UNSIGNED device build packed as an .ipa.
#
# Unsigned on purpose: a packet-tunnel extension needs the Network Extension entitlement, which only a
# paid Apple Developer team can sign. The .ipa is for re-signing (your own team, AltStore/SideStore
# with a paid account, TrollStore) and, above all, proves the whole iOS tree compiles — nothing iOS
# can be built on the Windows machine the rest of the project is developed on.

name: iOS
run-name: ${{ inputs.comment != '' && format('iOS: {0}', inputs.comment) || (github.event.head_commit.message != '' && github.event.head_commit.message || format('iOS ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      comment:
        description: 'Комментарий к сборке (отобразится в названии запуска)'
        required: false
        type: string
        default: ''
      upload_to_testflight:
        description: 'Upload build to TestFlight'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      # Gradle configures every project, including the Android ones, so AGP wants an SDK location.
      - name: Set up Android SDK (only for AGP's SDK-location check)
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # gomobile/gobind at the x/mobile version pinned in cores/go.mod (bind needs the matching runtime).
      - name: Install gomobile + XcodeGen
        run: |
          cd cores
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          brew install xcodegen

      # Compose Multiplatform 1.12 references iOS 26 UIKit (UIViewLayoutRegion): the iOS 26 SDK is needed
      # to LINK (the deployment target stays 15 — newer API is weak-linked). The runner defaults to an
      # older Xcode, so pick the newest one installed.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Report toolchain
        run: |
          xcodebuild -version
          go version
          java -version

      - name: Cache Go cores (Coreapi.xcframework)
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
          key: cores-ios-${{ hashFiles('sing-box/**', 'xray-core/**', 'amneziawg-go/**', 'YPtun/sharedUI/src/commonMain/kotlin/org/olcbox/app/vpn/coreapi/**') }}

      - name: Go cores → Coreapi.xcframework
        if: steps.cache-cores.outputs.cache-hit != 'true'
        working-directory: YPtun
        run: |
          gomobile init
          ./gradlew :sharedUI:buildCoresIosXcframework --no-configuration-cache --stacktrace

      - name: Kotlin → SharedUI.framework (device, release)
        working-directory: YPtun
        run: ./gradlew :sharedUI:linkReleaseFrameworkIosArm64 --no-configuration-cache

      - name: Generate App Icons
        working-directory: YPtun/iosApp
        run: bash generate_icons.sh

      - name: Generate the Xcode project
        working-directory: YPtun/iosApp
        run: xcodegen generate

      - name: Build (unsigned, device)
        working-directory: YPtun/iosApp
        run: |
          mkdir -p build
          VERSION=$(grep '^olcbox.version=' ../gradle.properties | cut -d= -f2 | tr -d '\r')
          CODE=$(grep '^olcbox.versionCode=' ../gradle.properties | cut -d= -f2 | tr -d '\r')
          xcodebuild \
            -project YPtun.xcodeproj \
            -scheme YPtun \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          # The full log is an artifact; here only what matters.
          grep -E "error:|Undefined symbols|referenced from|\*\* BUILD" build/xcodebuild.log | head -80 || true
          exit $STATUS

      - name: Pack .ipa
        working-directory: YPtun/iosApp
        run: |
          VERSION=$(grep '^olcbox.version=' ../gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/YPtun.app Payload/
          test -d Payload/YPtun.app/PlugIns/PacketTunnel.appex
          test -d Payload/YPtun.app/PlugIns/YPtunWidget.appex
          zip -qry "YPtun-$VERSION-unsigned.ipa" Payload
          ls -la *.ipa
          du -sh Payload/YPtun.app Payload/YPtun.app/PlugIns/PacketTunnel.appex

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-ios-unsigned
          path: YPtun/iosApp/*.ipa
          if-no-files-found: error

      - name: Sign IPA with Apple Distribution certificate
        working-directory: YPtun/iosApp
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERT_P12_BASE64" ]; then
            echo "Signing secret not configured, skipping."
            exit 0
          fi
          set -e
          VERSION=$(grep '^olcbox.version=' ../gradle.properties | cut -d= -f2 | tr -d '\r')

          # 1. Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. Import distribution certificate
          echo "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Identified signing certificate: $IDENTITY"

          # 3. Decode provisioning profiles
          echo "$PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.mobileprovision"
          echo "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"

          # 4. Copy embedded profiles
          cp "$RUNNER_TEMP/app.mobileprovision" Payload/YPtun.app/embedded.mobileprovision
          cp "$RUNNER_TEMP/tunnel.mobileprovision" Payload/YPtun.app/PlugIns/PacketTunnel.appex/embedded.mobileprovision
          cp "$RUNNER_TEMP/widget.mobileprovision" Payload/YPtun.app/PlugIns/YPtunWidget.appex/embedded.mobileprovision

          # 5. Extract and sanitize entitlements
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/app.entitlements"
          security cms -D -i "$RUNNER_TEMP/tunnel.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/tunnel.entitlements"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" | plutil -extract Entitlements xml1 - -o "$RUNNER_TEMP/widget.entitlements"

          # Apple profiles contain wildcard networkextension capabilities (hotspot-provider, app-proxy, etc.)
          # and com.apple.token keychain group, which are rejected by App Store / TestFlight validation.
          for ent in "$RUNNER_TEMP/app.entitlements" "$RUNNER_TEMP/tunnel.entitlements"; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension array" "$ent"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension:0 string packet-tunnel-provider" "$ent"
            /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$ent" 2>/dev/null || true
          done
          # Widget does not use networkextension
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.networkextension" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups:1" "$RUNNER_TEMP/widget.entitlements" 2>/dev/null || true

          # 6. Codesign frameworks
          if [ -d Payload/YPtun.app/Frameworks ]; then
            find Payload/YPtun.app/Frameworks -depth \( -name "*.framework" -o -name "*.dylib" \) | while read fw; do
              echo "Signing $fw"
              codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$fw"
            done
          fi

          # 7. Codesign extensions and main app
          echo "Signing YPtunWidget.appex..."
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/widget.entitlements" Payload/YPtun.app/PlugIns/YPtunWidget.appex

          echo "Signing PacketTunnel.appex..."
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/tunnel.entitlements" Payload/YPtun.app/PlugIns/PacketTunnel.appex

          echo "Signing YPtun.app..."
          codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/app.entitlements" Payload/YPtun.app

          codesign --verify --deep --strict --verbose=2 Payload/YPtun.app

          # 8. Repack into signed IPA
          zip -qry "YPtun-$VERSION-signed.ipa" Payload
          ls -lh *.ipa

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && (inputs.upload_to_testflight == true || inputs.upload_to_testflight == 'true')
        working-directory: YPtun/iosApp
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ ! -f YPtun-*-signed.ipa ]; then
            echo "TestFlight credentials or signed IPA missing, skipping."
            exit 0
          fi
          set -e
          VERSION=$(grep '^olcbox.version=' ../gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          echo "Uploading YPtun-$VERSION-signed.ipa to TestFlight..."
          xcrun altool --upload-app \
            -f "YPtun-$VERSION-signed.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-ios-signed
          path: YPtun/iosApp/*-signed.ipa
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: YPtun/iosApp/build/xcodebuild.log
          if-no-files-found: ignore
