# The workflow path already exists on the default branch, so GitHub exposes its manual dispatch UI.
# The native Swift/Rust release implementation lives in apple-release.yml and is resolved from the
# exact same commit as this caller. This lets the iOS release branch deploy without changing main.
name: iOS
run-name: "iOS 4.0.0 (${{ inputs.build_number }})${{ inputs.comment != '' && format(' — {0}', inputs.comment) || '' }}"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
        default: "501"
      comment:
        description: Build comment
        required: false
        type: string
        default: ""
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native-release:
    uses: ./.github/workflows/apple-release.yml
    with:
      build_number: ${{ inputs.build_number }}
      comment: ${{ inputs.comment }}
      upload_to_testflight: ${{ inputs.upload_to_testflight }}
    secrets: inherit
