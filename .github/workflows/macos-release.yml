name: Native macOS release candidate
run-name: "Native macOS RC ${{ inputs.build_number }}${{ inputs.comment != '' && format(' — {0}', inputs.comment) || '' }}"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
        default: "533"
      comment:
        description: Build comment
        required: false
        type: string
        default: ""
      upload_to_testflight:
        description: Upload the signed PKG to TestFlight
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        type: string
      comment:
        description: Build comment
        required: false
        type: string
        default: ""
      upload_to_testflight:
        description: Upload the signed PKG to TestFlight
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: native-macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs and signing material
        env:
          MACOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.MACOS_DISTRIBUTION_CERT_P12_BASE64 || secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          MACOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.MACOS_DISTRIBUTION_CERT_PASSWORD || secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_APP_BASE64 }}
          MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "build_number must be a positive integer" >&2
            exit 1
          }
          if [[ -z "${MACOS_DISTRIBUTION_CERT_P12_BASE64:-}" ]]; then
            echo "Signing certificate is not configured; this run will publish an unsigned build."
            exit 0
          fi
          if [[ -z "${MACOS_PROVISIONING_PROFILE_APP_BASE64:-}" || -z "${MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64:-}" ]]; then
            echo "Provisioning profiles for macOS (APP or TUNNEL) are missing; will produce unsigned artifacts."
            exit 0
          fi

          echo "$MACOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$MACOS_PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/app.provisionprofile" -o "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/tunnel.provisionprofile" -o "$RUNNER_TEMP/tunnel-profile.plist"

          python3 - <<'PY'
          import datetime
          import fnmatch
          import os
          import plistlib

          specs = (
              ("app", "org.yptun.app.macos", True),
              ("tunnel", "org.yptun.app.macos.tunnel", True),
          )
          for name, bundle_id, needs_tunnel in specs:
              path = os.path.join(os.environ["RUNNER_TEMP"], f"{name}-profile.plist")
              with open(path, "rb") as source:
                  profile = plistlib.load(source)
              expires = profile.get("ExpirationDate")
              now = datetime.datetime.now(datetime.timezone.utc)
              if expires is None or expires.replace(tzinfo=datetime.timezone.utc) <= now:
                  raise SystemExit(f"{name} provisioning profile is expired")
              entitlements = profile.get("Entitlements", {})
              application_id = entitlements.get("application-identifier", "")
              pattern = application_id.split(".", 1)[-1]
              if not fnmatch.fnmatchcase(bundle_id, pattern):
                  raise SystemExit(
                      f"{name} profile application identifier {application_id!r} "
                      f"does not allow {bundle_id!r}"
                  )
              groups = entitlements.get("com.apple.security.application-groups", [])
              if "group.org.yptun.app.macos" not in groups:
                  raise SystemExit(f"{name} profile does not allow group.org.yptun.app.macos")
              network_extensions = entitlements.get(
                  "com.apple.developer.networking.networkextension", []
              )
              if needs_tunnel and "packet-tunnel-provider" not in network_extensions:
                  raise SystemExit(f"{name} profile does not allow packet-tunnel-provider")
              print(f"Validated {name} provisioning profile; expires {expires.isoformat()}")
          PY

      - name: Select pinned Xcode
        run: |
          XCODE=/Applications/Xcode_26.3.app
          if [ ! -d "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache TrustTunnel Apple XCFramework
        id: trusttunnel-cache
        uses: actions/cache@v4
        with:
          path: YPtun/sharedUI/build/generated/cores/ios/VpnClientFramework.xcframework
          key: trusttunnel-apple-xcframework-1.1.12

      - name: Download TrustTunnel Apple XCFramework
        if: steps.trusttunnel-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p YPtun/sharedUI/build/generated/cores/ios
          curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://maven.pkg.github.com/TrustTunnel/TrustTunnelClient/com/adguard/trusttunnel/trusttunnel-client-apple/1.1.12/TrustTunnelClient-apple-1.1.12.zip" \
            -o "$RUNNER_TEMP/tt-apple.zip"
          unzip -q "$RUNNER_TEMP/tt-apple.zip" "VpnClientFramework.xcframework/*" -d YPtun/sharedUI/build/generated/cores/ios/
          rm -f "$RUNNER_TEMP/tt-apple.zip"
          test -d YPtun/sharedUI/build/generated/cores/ios/VpnClientFramework.xcframework

      - name: Generate and validate native Xcode project
        working-directory: YPtun/apple
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
          plutil -lint Configuration/macOS/*.plist
          plutil -lint Configuration/macOS/*.entitlements

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            snolc -> target
            csqtt/rust-client -> target
          cache-on-failure: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      - name: Restore validated native Apple XCFrameworks
        id: apple-framework-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: apple-xcframeworks-v2-xcode-26.3-rust-1.99.1-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock', 'core/yptun-core/**', 'core/yptun-ffi/**', 'core/scripts/build-apple.sh', 'core/scripts/build-go-apple.sh', 'core/scripts/build-specialized-apple.sh', 'core/scripts/verify-apple-rust-link.sh', 'core/scripts/validate-apple-xcframeworks.py') }}-${{ hashFiles('cores/**', 'sing-box/**', 'xray-core/**', 'amneziawg-go/**', 'awgproxy/**', 'free-turn-proxy/**', 'wdtt/**', 'masterdns/**', 'olcrtc/**', 'openflux/**') }}-${{ hashFiles('snolc/**', 'csqtt/**') }}

      - name: Validate restored Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit == 'true'
        run: python3 core/scripts/validate-apple-xcframeworks.py

      - name: Build specialized Apple cores (fail-fast)
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-specialized-apple.sh

      - name: Build Rust XCFramework and Swift bindings
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-apple.sh

      - name: Probe combined Apple Rust archives
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/verify-apple-rust-link.sh

      - name: Build in-process Apple network cores
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: |
          (cd openflux && go mod tidy -diff)
          (cd cores && go mod tidy -diff)
          GOMOBILE_APPLE_TARGETS=ios,iossimulator,macos bash core/scripts/build-go-apple.sh

      - name: Validate built Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: python3 core/scripts/validate-apple-xcframeworks.py

      - name: Save validated native Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: ${{ steps.apple-framework-cache.outputs.cache-primary-key }}

      - name: Build macOS release
        working-directory: YPtun/apple
        run: |
          mkdir -p build
          xcodebuild \
            -project YPtunApple.xcodeproj \
            -scheme "YPtun macOS" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac \
            MARKETING_VERSION=4.0.0 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > build/xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|Undefined symbols|referenced from|\*\* BUILD" build/xcodebuild.log | head -120 || true
          exit $STATUS

      - name: Verify build outputs and package unsigned PKG
        working-directory: YPtun/apple
        run: |
          APP_PATH="build/mac/Build/Products/Release/YPtun.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/Contents/PlugIns/YPtunPacketTunnel.appex"
          test -x "$APP_PATH/Contents/MacOS/YPtun"

          # Package unsigned app
          rm -rf pkg_root
          mkdir -p pkg_root
          cp -R "$APP_PATH" pkg_root/
          productbuild --component "pkg_root/YPtun.app" /Applications "YPtun-4.0.0-$BUILD_NUMBER-macOS-unsigned.pkg"
          zip -qry "YPtun-4.0.0-$BUILD_NUMBER-macOS-unsigned.zip" "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: YPtun-macos-unsigned-${{ inputs.build_number }}
          path: |
            YPtun/apple/*-unsigned.pkg
            YPtun/apple/*-unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Sign macOS app and build signed PKG
        working-directory: YPtun/apple
        env:
          MACOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.MACOS_DISTRIBUTION_CERT_P12_BASE64 || secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          MACOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.MACOS_DISTRIBUTION_CERT_PASSWORD || secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_APP_BASE64 }}
          MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64 }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_DISTRIBUTION_CERT_P12_BASE64" ] || [ -z "$MACOS_PROVISIONING_PROFILE_APP_BASE64" ]; then
            echo "Signing secrets are not configured; unsigned PKG remains available."
            exit 0
          fi
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/mac-app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Also import installer cert if configured
          INSTALLER_IDENTITY=""
          if [ -n "$MACOS_INSTALLER_CERT_P12_BASE64" ]; then
            echo "$MACOS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
            security import "$RUNNER_TEMP/installer-cert.p12" -P "$MACOS_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep -E "3rd Party Mac Developer Installer|Mac Installer Distribution" | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E "Apple Distribution|3rd Party Mac Developer Application" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$IDENTITY"

          APP_STAGING="pkg_signed/YPtun.app"
          rm -rf pkg_signed
          mkdir -p pkg_signed
          cp -R "build/mac/Build/Products/Release/YPtun.app" pkg_signed/

          echo "$MACOS_PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$APP_STAGING/Contents/embedded.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE_TUNNEL_BASE64" | base64 --decode > "$APP_STAGING/Contents/PlugIns/YPtunPacketTunnel.appex/Contents/embedded.provisionprofile"

          sign_item() {
            local target="$1"
            shift
            local attempts=0
            until codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$@" "$target"; do
              attempts=$((attempts + 1))
              if [ $attempts -ge 2 ]; then
                echo "Apple timestamp server unreachable for $target; falling back to --timestamp=none..." >&2
                codesign --force --options runtime --timestamp=none --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$@" "$target"
                return $?
              fi
              echo "codesign failed for $target, retrying in 3s ($attempts/2)..."
              sleep 3
            done
          }

          find "$APP_STAGING" -depth \( -name '*.framework' -o -name '*.dylib' \) | while read fw; do
            sign_item "$fw"
          done
          sign_item "$APP_STAGING/Contents/PlugIns/YPtunPacketTunnel.appex" --entitlements Configuration/macOS/PacketTunnel.entitlements
          sign_item "$APP_STAGING" --entitlements Configuration/macOS/YPtun.entitlements

          codesign --verify --deep --strict --verbose=2 "$APP_STAGING"

          if [ -n "$INSTALLER_IDENTITY" ]; then
            productbuild --component "$APP_STAGING" /Applications --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN_PATH" "YPtun-4.0.0-$BUILD_NUMBER-signed.pkg"
          else
            productbuild --component "$APP_STAGING" /Applications "YPtun-4.0.0-$BUILD_NUMBER-signed.pkg"
          fi
          test -s "YPtun-4.0.0-$BUILD_NUMBER-signed.pkg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YPtun-macos-signed-${{ inputs.build_number }}
          path: YPtun/apple/*-signed.pkg
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed PKG to TestFlight
        if: inputs.upload_to_testflight == true
        working-directory: YPtun/apple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PKG="YPtun-4.0.0-$BUILD_NUMBER-signed.pkg"
          if [ ! -s "$PKG" ]; then
            echo "Signed PKG not available; skipping TestFlight upload."
            exit 0
          fi
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          UPLOAD_LOG="build/altool-upload-macos.log"
          mkdir -p build
          set +e
          xcrun altool --upload-app \
            -f "$PKG" \
            -t macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_STATUS" -ne 0 ] || grep -Eq '(^|[[:space:]])ERROR:' "$UPLOAD_LOG"; then
            echo "App Store Connect rejected the macOS upload; see altool-upload-macos.log above." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-xcodebuild-log-${{ inputs.build_number }}
          path: YPtun/apple/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app-store-upload-log-${{ inputs.build_number }}
          path: YPtun/apple/build/altool-upload-macos.log
          if-no-files-found: ignore
          retention-days: 30
