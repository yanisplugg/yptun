# Shared (commonTest) unit tests: the parsers, the subscription importer and the panel link families
# the iPhone build shares. Run on the JVM target, like main (several tests use JVM-only APIs). Runs on every push to the
# iOS branch that touches the shared code, and by hand.
name: Shared tests (iOS)

on:
  push:
    branches: [feat/testflight-deploy]
    paths:
      - 'YPtun/sharedUI/**'
      - '.github/workflows/shared-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle configures every project, including the Android ones, so AGP wants an SDK location.
      - name: Set up Android SDK (only for AGP's SDK-location check)
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tests-${{ runner.os }}-${{ hashFiles('YPtun/**/*.gradle.kts', 'YPtun/gradle/libs.versions.toml') }}

      - name: commonTest on the JVM
        working-directory: YPtun
        run: |
          # Full assertion messages in the log (the HTML report is only in the artifact).
          cat > "$RUNNER_TEMP/testlog.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "failed"
                      exceptionFormat "full"
                      showStackTraces false
                  }
              }
          }
          GRADLE
          ./gradlew :sharedUI:jvmTest --continue --no-configuration-cache --init-script "$RUNNER_TEMP/testlog.init.gradle"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-reports
          path: |
            YPtun/sharedUI/build/reports/tests/
            YPtun/sharedUI/build/test-results/
          if-no-files-found: ignore
