name: Apple Rust core

on:
  workflow_dispatch:
  push:
    branches:
      - feat/testflight-deploy
    paths:
      - "core/**"
      - "YPtun/apple/**"
      - ".github/workflows/apple-core.yml"
  pull_request:
    paths:
      - "core/**"
      - "YPtun/apple/**"
      - ".github/workflows/apple-core.yml"

permissions:
  contents: read

concurrency:
  group: apple-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Test Rust workspace
        working-directory: core
        run: cargo test --workspace --locked

  build-apple:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false
      - name: Restore native Apple XCFrameworks
        id: apple-framework-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: apple-xcframeworks-v1-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock', 'core/yptun-core/**', 'core/yptun-ffi/**', 'core/scripts/build-apple.sh', 'core/scripts/build-go-apple.sh', 'core/scripts/build-specialized-apple.sh') }}-${{ hashFiles('cores/**', 'sing-box/**', 'xray-core/**', 'amneziawg-go/**', 'awgproxy/**', 'free-turn-proxy/**', 'wdtt/**', 'masterdns/**', 'olcrtc/**', 'openflux/**') }}-${{ hashFiles('snolc/**', 'csqtt/**') }}
      # Keep the fragile Apple static-archive/linker stage first. It exercises every device,
      # simulator and macOS slice in a few minutes and warms Cargo for the rest of the job. A
      # linker regression must fail here, not after the much slower in-process Go core build.
      - name: Build specialized Apple cores (fail-fast)
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-specialized-apple.sh
      - name: Build XCFramework and Swift bindings
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: bash core/scripts/build-apple.sh
      - name: Verify Swift package
        working-directory: YPtun/apple/Packages/YPtunRustBridge
        run: swift build
      - name: Test migration foundation
        working-directory: YPtun/apple/Packages/YPtunAppleDataMigration
        run: swift test
      - name: Build shared Apple packages
        working-directory: YPtun/apple/Packages/YPtunAppleKit
        run: swift test
      - name: Build in-process Apple network cores
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        run: |
          (cd openflux && go mod tidy)
          (cd cores && go mod tidy)
          GOMOBILE_APPLE_TARGETS=ios,iossimulator,macos bash core/scripts/build-go-apple.sh
      - name: Save native Apple XCFrameworks
        if: steps.apple-framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
            YPtun/sharedUI/build/generated/cores/ios/Coreapi.xcframework
            YPtun/sharedUI/build/generated/cores/ios/SnolcCore.xcframework
            YPtun/sharedUI/build/generated/cores/ios/CsqttCore.xcframework
          key: ${{ steps.apple-framework-cache.outputs.cache-primary-key }}
      - name: Generate native Apple project
        working-directory: YPtun/apple
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Smoke-build native iOS shell
        working-directory: YPtun/apple
        run: |
          xcodebuild -project YPtunApple.xcodeproj -scheme "YPtun iOS" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-smoke \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build native iOS release for device
        working-directory: YPtun/apple
        run: |
          xcodebuild -project YPtunApple.xcodeproj -scheme "YPtun iOS" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Capture native iOS review screenshots
        working-directory: YPtun/apple
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"] and x["isAvailable"]))')
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/ios-smoke/Build/Products/Debug-iphonesimulator/YPtun.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.yptun.app
          sleep 3
          mkdir -p review
          xcrun simctl io "$UDID" screenshot review/iphone-light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 1
          xcrun simctl io "$UDID" screenshot review/iphone-dark.png
      - name: Smoke-build native macOS shell
        working-directory: YPtun/apple
        run: |
          xcodebuild -project YPtunApple.xcodeproj -scheme "YPtun macOS" \
            -derivedDataPath build/macos-smoke \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify generated artifacts
        run: |
          test -d YPtun/apple/Packages/YPtunRustBridge/Artifacts/yptun_ffiFFI.xcframework
          test -s YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated/yptun_ffi.swift
          find YPtun/apple/Packages/YPtunRustBridge -maxdepth 5 -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: yptun-apple-rust-bridge-${{ github.sha }}
          path: |
            YPtun/apple/Packages/YPtunRustBridge/Artifacts
            YPtun/apple/Packages/YPtunRustBridge/Sources/YPtunRustBridge/Generated
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yptun-native-apple-review-${{ github.sha }}
          path: YPtun/apple/review
          if-no-files-found: ignore
          retention-days: 14
