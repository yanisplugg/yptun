# Android APK build (arm64-v8a) for testing a branch on a phone.
#
# Runs on push to Beta and by hand. The APK is signed with the release keystore when
# the repo has the secrets ANDROID_RELEASE_KEYSTORE_BASE64 / ANDROID_RELEASE_STORE_PASSWORD /
# ANDROID_RELEASE_KEY_ALIAS / ANDROID_RELEASE_KEY_PASSWORD (then it installs OVER the existing app).
# Without them it is signed with a throwaway key: it installs, but only after uninstalling the app
# that is already on the phone (different signature).
# The APK is uploaded as an artifact and, best effort, to a temporary file host; the link is printed
# in the log and in the job summary.

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Beta
      - ccr-8310fbb6-qvxabu

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          # compileSdk 37: the package id is spelled differently across sdkmanager versions, and if
          # neither exists AGP downloads the platform itself.
          sdkmanager --list 2>/dev/null | grep -E 'platforms;android-37' | head -3 || true
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37" || true

      # gomobile at the x/mobile version pinned in cores/go.mod (bind needs the matching runtime).
      - name: Install gomobile
        run: |
          cd cores
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Configure signing
        working-directory: YPtun
        run: |
          if [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] &&
             [ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_ALIAS}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > release-keystore.jks
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${ANDROID_RELEASE_STORE_PASSWORD}
          keyAlias=${ANDROID_RELEASE_KEY_ALIAS}
          keyPassword=${ANDROID_RELEASE_KEY_PASSWORD}
          EOF
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No release signing secrets - the APK gets a throwaway key (uninstall the old app first)."
            keytool -genkeypair -keystore ci-throwaway.jks -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=YPtun CI"
            cat > keystore.properties <<EOF
          storeFile=ci-throwaway.jks
          storePassword=android
          keyAlias=ci
          keyPassword=android
          EOF
            echo "SIGNING=throwaway" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: YPtun
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export CGO_ENABLED=1
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 -Polcbox.android.abiFilters=arm64-v8a :androidApp:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          set -eu
          ver=$(grep '^olcbox.version=' YPtun/gradle.properties | cut -d= -f2)
          code=$(grep '^olcbox.versionCode=' YPtun/gradle.properties | cut -d= -f2)
          mkdir -p dist
          apk=$(find YPtun/androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)
          [ -n "$apk" ] || { echo "no APK produced"; exit 1; }
          cp "$apk" "dist/YPtun-${ver}-${code}-arm64-${SIGNING}.apk"
          "${ANDROID_HOME}"/build-tools/*/apksigner verify --print-certs "dist/YPtun-${ver}-${code}-arm64-${SIGNING}.apk" | head -3
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: yptun-android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Best effort: a failed upload must not fail the build (the artifact above is the fallback).
      - name: Upload to a temporary file host
        continue-on-error: true
        run: |
          apk=$(ls dist/*.apk | head -1)
          url=$(curl -sS --retry 3 -F "reqtype=fileupload" -F "time=72h" \
            -F "fileToUpload=@${apk}" https://litterbox.catbox.moe/resources/internals/api.php || true)
          case "$url" in
            https://*) ;;
            *) url=$(curl -sS --retry 3 -F "file=@${apk}" https://0x0.st || true) ;;
          esac
          echo "APK_LINK=${url}"
          echo "### APK: ${url}" >> "$GITHUB_STEP_SUMMARY"
