name: YPtunApple

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "501"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  YPtunAppleKit:
    path: Packages/YPtunAppleKit
  YPtunRustBridge:
    path: Packages/YPtunRustBridge
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: 5.16.0

targets:
  YPtunIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOSApp
      - path: Resources/Assets.xcassets
      - path: Resources/Licenses
    settings:
      base:
        PRODUCT_NAME: YPtun
        PRODUCT_MODULE_NAME: YPtunIOS
        PRODUCT_BUNDLE_IDENTIFIER: org.yptun.app
        INFOPLIST_FILE: Configuration/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS/YPtun.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: YPtunAppleKit
        product: YPtunShared
      - package: YPtunAppleKit
        product: YPtunMigrationSupport
      - package: YPtunAppleKit
        product: YPtunAppUI
      - package: YPtunRustBridge
        product: YPtunRustBridge
      - target: YPtunPacketTunnelIOS
        embed: true
      - target: YPtunWidget
        embed: true

  YPtunPacketTunnelIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PacketTunnel
    settings:
      base:
        PRODUCT_NAME: YPtunPacketTunnel
        PRODUCT_MODULE_NAME: YPtunPacketTunnelIOS
        PRODUCT_BUNDLE_IDENTIFIER: org.yptun.app.tunnel
        INFOPLIST_FILE: Configuration/iOS/PacketTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-Wl,-no_compact_unwind"
    dependencies:
      - package: YPtunAppleKit
        product: YPtunShared
      - package: YPtunRustBridge
        product: YPtunRustBridge
      - package: Tun2SocksKit
        product: Tun2SocksKit
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
      - framework: ../sharedUI/build/generated/cores/ios/Coreapi.xcframework
        embed: false
      - framework: ../sharedUI/build/generated/cores/ios/SnolcCore.xcframework
        embed: false
      - framework: ../sharedUI/build/generated/cores/ios/CsqttCore.xcframework
        embed: false

  YPtunWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_NAME: YPtunWidget
        PRODUCT_MODULE_NAME: YPtunWidget
        PRODUCT_BUNDLE_IDENTIFIER: org.yptun.app.widget
        INFOPLIST_FILE: Configuration/iOS/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: YPtunAppleKit
        product: YPtunShared
      - package: YPtunAppleKit
        product: YPtunVPNControl
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  YPtunMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOSApp
      - path: Resources/Assets.xcassets
      - path: Resources/Licenses
    settings:
      base:
        PRODUCT_NAME: YPtun
        PRODUCT_MODULE_NAME: YPtunMac
        PRODUCT_BUNDLE_IDENTIFIER: org.yptun.app.macos
        INFOPLIST_FILE: Configuration/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS/YPtun.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: YPtunAppleKit
        product: YPtunShared
      - package: YPtunAppleKit
        product: YPtunMigrationSupport
      - package: YPtunAppleKit
        product: YPtunAppUI
      - package: YPtunRustBridge
        product: YPtunRustBridge
      - target: YPtunPacketTunnelMac
        embed: true

  YPtunPacketTunnelMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PacketTunnel
    settings:
      base:
        PRODUCT_NAME: YPtunPacketTunnel
        PRODUCT_MODULE_NAME: YPtunPacketTunnelMac
        PRODUCT_BUNDLE_IDENTIFIER: org.yptun.app.macos.tunnel
        INFOPLIST_FILE: Configuration/macOS/PacketTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-Wl,-no_compact_unwind"
    dependencies:
      - package: YPtunAppleKit
        product: YPtunShared
      - package: YPtunRustBridge
        product: YPtunRustBridge
      - package: Tun2SocksKit
        product: Tun2SocksKit
      - sdk: libresolv.tbd
      - framework: ../sharedUI/build/generated/cores/ios/Coreapi.xcframework
        embed: false
      - framework: ../sharedUI/build/generated/cores/ios/SnolcCore.xcframework
        embed: false
      - framework: ../sharedUI/build/generated/cores/ios/CsqttCore.xcframework
        embed: false

schemes:
  YPtun iOS:
    build:
      targets:
        YPtunIOS: all
    run:
      config: Debug
    archive:
      config: Release
  YPtun macOS:
    build:
      targets:
        YPtunMac: all
    run:
      config: Debug
    archive:
      config: Release
