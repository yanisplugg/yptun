#Gradle
org.gradle.jvmargs=-Xmx6G
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
# Use all 12 cores for parallel task execution (was defaulting to a single worker in practice).
org.gradle.workers.max=12
# Compile independent modules' Kotlin in parallel within the same project.
kotlin.parallel.tasks.in.project=true

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true
org.jetbrains.compose.experimental.macos.enabled=true
compose.desktop.packaging.checkJdkVendor=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
olcbox.version=3.2.4
olcbox.versionCode=329
# Идентичность приложения для Android. Пока НЕ трогать: сборка с другим id ставится как отдельное
# приложение, а не обновлением. Порядок переезда — в LegacyMigration.kt: сначала релиз с мостом на
# старом id, и только следующим релизом здесь ставится новый id (например org.yptun.app).
olcbox.applicationId=org.olcbox.app

#Android
android.useAndroidX=true
android.r8.failOnMissingKotlinMetadata=false
kotlin.metadata.ignore.unsupported=true

# AGP 9.0+ performance and cleanup
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
